name: on-schedule
run-name: on schedule

on:
  schedule:
    # weekly, Monday 12:00 UTC -- after InsightNet's Sunday 06:23 UTC refresh
    - cron: "0 12 * * 1"

  # run if user manually requests it
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-citations:
    # only run on user instance of template, not template itself
    if: github.repository != 'greenelab/lab-website-template'
    uses: ./.github/workflows/update-citations.yaml
    with:
      open-pr: true
